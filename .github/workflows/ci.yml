name: CI

# Publishing is NOT done here. The Mintlify GitHub App deploys this repo
# automatically on every push to the default branch; adding a deploy step
# would publish the same commit twice. This workflow only guards what the
# App would otherwise publish broken: an MDX file that does not build, a
# dead internal link, or an en/zh pair that has drifted apart.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The CLI version is pinned deliberately, the same way orbi-build/orbi
      # pins it: an unpinned `npm install -g mint` resolves a fresh manifest
      # and a bad transitive dependency reddens every open PR for a reason
      # that has nothing to do with the change under review. Upgrading is a
      # one-line bump here.
      - name: Install the Mintlify CLI
        run: npm install -g mint@4.2.890

      # Strict: exits non-zero on any warning or error, so a broken build or
      # a dead internal link fails the check rather than shipping.
      - name: Validate the docs build
        run: mint validate

      # The diagrams are hand-written and a documentation generator run
      # against this repo deletes them (2026-09-20: three of four went, and
      # every zh/ page with them). `mint validate` is happy either way — it
      # checks that the MDX builds, not that the content is still there. This
      # asserts the four flow diagrams survive any future pass.
      - name: Check the hand-written mermaid diagrams are intact
        run: |
          python3 - <<'PY'
          import sys

          expected = {
              "index.mdx": 2,
              "delivery-lifecycle.mdx": 1,
              "zh/index.mdx": 2,
              "zh/delivery-lifecycle.mdx": 1,
          }
          problems = []
          for path, want in sorted(expected.items()):
              try:
                  got = open(path).read().count("```mermaid")
              except FileNotFoundError:
                  problems.append(f"{path}: file is missing entirely")
                  continue
              if got != want:
                  problems.append(f"{path}: expected {want} mermaid diagram(s), found {got}")

          for problem in problems:
              print(problem)
          print(f"\n{len(expected)} pages checked, {len(problems)} problems")
          if problems:
              print("\nSee 'Hand-written content' in README.md. If a diagram was")
              print("removed on purpose, update the expected counts in this check.")
          sys.exit(1 if problems else 0)
          PY

      # Chinese has no inter-word spaces, so a closing ** that lands before a
      # Han character is not a valid closing delimiter under CommonMark and
      # renders as literal asterisks — taking the rest of the line's bold with
      # it. `mint validate` builds such a page happily. This renders every
      # page with a CommonMark parser and fails if any ** survives.
      - name: Check bold renders (Chinese ** closing-delimiter trap)
        run: |
          npm install --no-save --silent markdown-it@14
          node - <<'JS'
          const md = require('markdown-it')({html: true});
          const fs = require('fs'), path = require('path');
          const files = [...fs.readdirSync('.'), ...fs.readdirSync('zh').map(f => 'zh/' + f)]
            .filter(f => f.endsWith('.mdx'));
          let bad = 0;
          for (const rel of files) {
            const lines = fs.readFileSync(rel, 'utf8').split('\n');
            let fmDone = false, inFm = false, inFence = false;
            lines.forEach((line, i) => {
              if (!fmDone) {
                if (i === 0 && line.trim() === '---') { inFm = true; return; }
                if (inFm && line.trim() === '---') { inFm = false; fmDone = true; return; }
                if (inFm) return;
                fmDone = true;
              }
              if (/^\s*```/.test(line)) { inFence = !inFence; return; }
              if (inFence || !line.includes('**')) return;
              if (md.renderInline(line).replace(/<[^>]+>/g, '').includes('**')) {
                console.log(`${rel}:${i + 1}  bold does not render: ${line.trim().slice(0, 100)}`);
                bad++;
              }
            });
          }
          console.log(`\n${files.length} pages checked, ${bad} lines with literal **`);
          if (bad) console.log('\nMove the punctuation outside the bold: **\u6210\u529f\u5224\u636e**\uff1a not **\u6210\u529f\u5224\u636e\uff1a**');
          process.exit(bad ? 1 : 0);
          JS

      # UI element names in zh/ must match what the product's Chinese interface
      # actually shows (orbi-cloud src/i18n.ts, where Chinese is the source and
      # English the translation). That repo is private, so instead of checking
      # every string this guards the mismatches found on 2026-09-21 from
      # creeping back in. Add a row when a new one is found and fixed.
      - name: Check zh UI names against known product wording
        run: |
          python3 - <<'PY'
          import glob, io, sys

          WRONG = {
              "**等你评审**": "**评审中** (the delivery history tab)",
              "**待评审**": "**评审中** (the tab was renamed with the 2026-09-26 status page redesign)",
              "**通过 Stripe 订阅**": "**订阅 Orbi Cloud** (the Chinese button; 'Subscribe with Stripe' is the English one)",
              "**这一步怎么做**": "**看这一步怎么做 ▶**",
              "**request ID**": "**request id**",
              "**自动重试次数已用尽**": "**自动重试次数已用完**",
              "**①需要你处理**": "**① 需要你处理** (the redesigned page puts a space after ①)",
              "**③参考**": "**设置与参考** (the ①②③ layout is gone)",
              "**技术支持**卡片": "the account menu's **加入 Telegram 群获取技术支持** (the support card was removed)",
              "**账户**卡片": "the account menu under the avatar (the account card was removed)",
              "**让 Orbi 试这张**": "**试试 →**",
              "**发个版本（版本号）**": "**版本** under **设置与参考**",
              "**本月缓存命中率**": "**缓存命中率**",
              "**配置自己的模型**": "**模型配置** in the account menu",
          }
          bad = []
          for f in sorted(glob.glob("zh/*.mdx")):
              for i, line in enumerate(io.open(f, encoding="utf-8"), 1):
                  for wrong, right in WRONG.items():
                      if wrong in line:
                          bad.append(f"{f}:{i}  {wrong} -> the product says {right}")
          for b in bad:
              print(b)
          print(f"\n{len(WRONG)} known mismatches guarded, {len(bad)} present")
          sys.exit(1 if bad else 0)
          PY

      # The en/zh contract: same page set, and every zh internal link stays
      # inside /zh/. A zh page that links to an en page silently drops the
      # reader out of their language, and a missing translation is a 404 in
      # the zh navigation — neither is something `mint validate` checks.
      - name: Check en/zh parity and zh link prefixes
        run: |
          python3 - <<'PY'
          import glob, os, re, sys

          en = {os.path.splitext(f)[0] for f in glob.glob("*.mdx")}
          zh = {os.path.splitext(os.path.basename(f))[0] for f in glob.glob("zh/*.mdx")}
          # Checked by full path, not basename: the zh pages point at
          # images/zh/, whose files share their names with the English ones, so
          # a basename set would pass a reference to a file that is not there.
          images = {os.path.join(root, f)
                    for root, _, names in os.walk("images") for f in names}
          problems = []

          for name in sorted(en - zh):
              problems.append(f"missing translation: zh/{name}.mdx")
          for name in sorted(zh - en):
              problems.append(f"zh page with no English source: zh/{name}.mdx")

          for path in sorted(glob.glob("*.mdx") + glob.glob("zh/*.mdx")):
              is_zh = path.startswith("zh/")
              text = open(path).read()
              # Images are <Frame><img src=...> rather than Markdown, so both
              # forms are collected — a check that only reads Markdown links
              # would pass vacuously now that no image uses that syntax.
              targets = [m.group(1) for m in re.finditer(r"\]\((/[^)\s]+)\)", text)]
              targets += [m.group(1) for m in re.finditer(r'<img\s[^>]*src="(/[^"]+)"', text)]
              for target in targets:
                  if target.startswith("/images/"):
                      if target.lstrip("/") not in images:
                          problems.append(f"{path}: missing image {target}")
                  elif is_zh:
                      if not target.startswith("/zh/"):
                          problems.append(f"{path}: zh page links outside /zh/ -> {target}")
                      elif target.split("#")[0][len("/zh/"):] not in zh:
                          problems.append(f"{path}: dead link {target}")
                  elif target.split("#")[0].lstrip("/") not in en:
                      problems.append(f"{path}: dead link {target}")

          for problem in problems:
              print(problem)
          print(f"\n{len(en)} en pages, {len(zh)} zh pages, {len(problems)} problems")
          sys.exit(1 if problems else 0)
          PY
